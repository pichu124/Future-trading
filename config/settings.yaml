# settings.yaml — cấu hình bot VN30F (KHÔNG chứa secret; secret ở .env)
# Giá trị `null` = CHƯA ĐIỀN. Module nào cần giá trị đó sẽ từ chối chạy
# (core.settings.require) thay vì tự đoán. Chạy `python -m core.settings`
# để xem danh sách còn thiếu.

paths:
  # Đặt NGOÀI thư mục đồng bộ Dropbox (CLAUDE.md mục 3b). Đường dẫn tương đối
  # tính từ gốc repo.
  data_dir: data
  state_dir: state
  log_dir: logs        # log JSON theo ngày (bot_YYYY-MM-DD.jsonl, record_YYYY-MM-DD.jsonl)
  # Thư mục data_warehouse của vnstock-dashboard (chỉ để import dữ liệu cũ).
  # Ví dụ Windows: C:/vnstock/data_warehouse
  dashboard_warehouse: null

contract:
  underlying: VN30
  multiplier_vnd_per_point: 100000   # 100.000 VNĐ / điểm — KIỂM TRA LẠI trước live
  tick_size_points: 0.1
  daily_limit_pct: 7.0
  roll_days_before_expiry: 1          # N phiên CUỐI của F1M (gồm ngày đáo hạn) bot giao dịch F2M; 0 = không roll sớm

# Lịch phiên phái sinh (giờ Asia/Ho_Chi_Minh, HH:MM). KIỂM TRA LẠI theo
# thông báo hiện hành của HNX trước khi chạy live.
session:
  pre_open_start: "08:30"
  ato_start: "08:45"
  continuous_am_start: "09:00"
  lunch_start: "11:30"
  continuous_pm_start: "13:00"
  atc_start: "14:30"
  close: "14:45"

# Phí & thuế tính theo VNĐ / hợp đồng / MỘT CHIỀU (mở hoặc đóng).
# Điền theo biểu phí của broker bạn dùng. Backtest từ chối chạy khi còn null.
fees:
  broker_fee_vnd_per_contract: null
  exchange_fee_vnd_per_contract: null
  clearing_fee_vnd_per_contract: null   # phí bù trừ VSDC — FAQ KRX của DNSE ghi 2.550đ/HĐ mỗi giao dịch; kiểm biểu phí hiện hành
  tax_vnd_per_contract: null            # thuế TNCN theo quy định hiện hành (tính theo giá trị giao dịch nếu cần)

backtest:
  slippage_ticks: 1                     # trượt giá tối thiểu mỗi lần khớp
  initial_capital_vnd: null
  # Dữ liệu chỉ có bar (không bid/ask): engine dựng tick giả với spread = N bước giá
  # (bid = giá, ask = giá + N bước khi N = 1). Đo lại spread thật khi có dữ liệu tick.
  synthetic_spread_ticks: 1

# Paper broker (dùng chung cho backtest và paper trading). Độ trễ từ lúc gửi lệnh tới lúc lệnh
# có thể khớp. KIỂM TRA LẠI bằng đo thực tế round-trip tới DNSE khi có API key.
paper:
  latency_ms: 300
  latency_jitter_ms: 200                # cộng ngẫu nhiên [0, jitter] mỗi lệnh
  seed: 0                               # cố định để backtest lặp lại được
  # Paper dùng feed tổng hợp DNSE + SSI (như live: lệch giá / một feed im ⇒ ngừng mở vị thế)?
  # true ⇒ cần SSI_API_KEY/SECRET và Telegram để nhập /otp ssi <mã> lúc khởi động. false ⇒ chỉ feed DNSE.
  composite_feed: false

risk:
  max_contracts: 1
  max_daily_loss_points: null
  max_trades_per_day: null
  max_consecutive_losses: null
  no_entry_open_minutes: 15             # không vào lệnh N phút đầu phiên liên tục sáng
  last_entry_time: "14:15"
  flatten_time: "14:25"                 # đóng hết trước ATC
  trade_on_expiry_day: false
  broker_timeout_seconds: 10
  # Vị thế phải có lệnh stop (tag "stop") được broker XÁC NHẬN trong N giây sau khi khớp,
  # quá hạn ⇒ risk_manager yêu cầu đóng vị thế. KIỂM TRA LẠI theo độ trễ thực tế của broker.
  stop_grace_seconds: 5
  # Đang có vị thế mà KHÔNG có dữ liệu thị trường quá N giây trong phiên liên tục ⇒ đóng hết bằng
  # MTL (stop do bot giữ thì mất feed = stop mù). Nghỉ trưa không tính. Lệch giá DNSE/SSI chỉ chặn mở.
  flatten_on_feed_silence_seconds: 30

# Tham số chiến lược. Mỗi lần đổi cấu hình để thử ⇒ ghi một dòng vào research/log.md và tăng
# --n-trials khi chạy backtest (CLAUDE.md mục 6). KHÔNG tối ưu trên toàn bộ dữ liệu.
strategy:
  orb:                                  # strategy/baseline_orb.py — phá biên độ đầu phiên
    range_minutes: 15                   # biên = đỉnh/đáy N phút đầu phiên liên tục sáng
    reward_risk: 1.5                    # chốt lời = 1.5 × khoảng cách tới stop (cạnh đối diện)
    max_trades_per_day: 2
    qty: 1

# Ghi tick ra data/raw/YYYY-MM-DD/ (recorder/, scripts/record_today.py).
recorder:
  flush_seconds: 5                      # crash mất tối đa ngần này giây dữ liệu chưa ghi
  max_buffer_rows: 5000                 # đệm đầy thì ghi ngay, không chờ đủ giờ
  start: "08:30"
  stop: "15:00"

feeds:
  primary: dnse
  backup: ssi
  feed_divergence_ticks: 3
  feed_stale_seconds: 5
  switch_back_after_seconds: 30         # DNSE sống lại liên tục N giây mới chuyển về làm nguồn chính

brokers:
  # Live: broker chính + dự phòng, chọn trong dnse | ssi | tcbs (phải khác nhau). Dự phòng CHỈ đặt lệnh đối ứng
  # khẩn cấp (CLAUDE.md mục 3). Feed tổng hợp luôn là DNSE + SSI dù broker là gì. tcbs ⇒ cần tcbs_enabled.
  primary: dnse
  backup: ssi
  # TCBS = broker THỨ 3, tuỳ chọn. CLAUDE.md: chỉ bật sau khi DNSE + SSI chạy ổn định.
  tcbs_enabled: false
  tcbs:                                 # brokers/tcbs.py — khoá + số tài khoản ở .env (TCBS_*)
    base_url: https://openapi.tcbs.com.vn
    # CHỈ đặt true sau khi chạy scripts/tcbs_trading_probe.py và đối chiếu ❓ ở docs/broker_notes.md §2b.
    api_verified: false
    request_timeout_seconds: 10
    poll_seconds: 1
    uncertain_resolve_seconds: 15       # tài liệu TCBS: không thấy theo refId ⇒ chờ 10–15s tra lại
  dnse:                                 # brokers/dnse.py — số tiểu khoản đặt ở .env (DNSE_ACCOUNT_NO)
    base_url: https://openapi.dnse.com.vn   # UAT: https://openapi-uat.dnse.com.vn
    # Gói vay phái sinh: GET /accounts/{tiểu khoản}/loan-packages?marketType=DERIVATIVE
    # (scripts/dnse_trading_probe.py in ra). null ⇒ không chạy live.
    loan_package_id: null
    otp_type: email_otp                 # OTP nhập tay qua Telegram: /otp <mã>
    # Thời hạn trading token — CHƯA biết (❓ broker_notes §1.1); hỏi DNSE / đo bằng probe. null ⇒ không chạy live.
    trading_token_ttl_seconds: null
    token_renew_before_seconds: 300     # xin OTP mới trước khi token hết hạn
    otp_resend_seconds: 120             # không xin OTP dồn dập
    # CHỈ đặt true sau khi chạy scripts/dnse_trading_probe.py (đọc + UAT đặt/huỷ thử) và đã đối
    # chiếu các mục ❓ ở docs/broker_notes.md §1.5. false ⇒ adapter từ chối mọi lệnh thật ở production.
    api_verified: false
    request_timeout_seconds: 10
    poll_seconds: 1                     # chu kỳ đọc sổ lệnh (khớp lệnh) — hạn mức rate limit ❓
    uncertain_resolve_seconds: 15       # lệnh "không rõ" (timeout/5xx) không thấy trong sổ sau N giây ⇒ REJECTED
  ssi:                                  # brokers/ssi.py — dự phòng; khoá ở .env (SSI_CLIENT_ID/API_KEY/API_SECRET/PRIVATE_KEY_PATH/ACCOUNT)
    base_url: https://api.ssi.com.vn
    stream_url: wss://stream.ssi.com.vn/ws/v3
    # Mã hợp đồng SSI nhận khi ĐẶT LỆNH: krx (41I1GB000) hay name (VN30F2611) — ❓ broker_notes §2.3;
    # scripts/ssi_trading_probe.py in mã masterdata trả về. null ⇒ không chạy live.
    order_symbol_format: null
    # Loại lệnh thị trường cho phái sinh: MTL hay MP (SDK: MTL = HOSE, MP = HNX) — ❓. null ⇒ không chạy live.
    market_order_type: null
    # CHỈ đặt true sau khi chạy scripts/ssi_trading_probe.py và đối chiếu ❓ ở docs/broker_notes.md §2.6.
    api_verified: false
    request_timeout_seconds: 10
    poll_seconds: 1                     # đọc sổ lệnh REST (stream TRADING chỉ để nhanh hơn)
    uncertain_resolve_seconds: 15       # không thấy clientRequestId trong sổ sau N giây ⇒ REJECTED

live:
  # Hostname DUY NHẤT được chạy bot (Windows: biến COMPUTERNAME). Máy khác từ chối khởi động
  # ⇒ không bao giờ có hai máy cùng đặt lệnh. Xem CLAUDE.md mục 3b.
  allowed_machine: null
  lock_stale_after_seconds: 120
  # Live: sau khi kết nối, chờ /otp <broker> <mã> cho DNSE + SSI tối đa N giây; quá ⇒ thoát, không giao dịch.
  otp_wait_seconds: 600

monitoring:
  heartbeat_seconds: 30
  telegram_channel: trading             # dùng TELEGRAM_TRADING_BOT_TOKEN / _CHAT_ID trong .env
