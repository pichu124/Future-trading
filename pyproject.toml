[project]
name = "future-trading"
version = "0.1.0"
description = "Bot giao dịch intraday hợp đồng tương lai VN30"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["core", "feeds", "recorder", "strategy", "risk", "brokers",
            "backtest", "live", "monitoring", "utils"]
